<!doctype html>
<html lang="de"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Hupsclick">
    <meta name="publisher" content="Hupsclick">
    <meta name="description" content="HUPSCLICK COUNDOWN HUD DESIGN">
    <meta name="keywords" content="HUPSCLICK, COUNDOWN, HUD DESIGN, Deutsch">
    <meta name="copyright" content="Hupsclick">
    <meta property="og:title" content="HUPSCLICK COUNDOWN HUD DESIGN">
    <meta property="og:description" content="HUPSCLICK COUNDOWN HUD DESIGN">
    <meta property="og:type" content="website">
    <link rel="shortcut icon" href="assets/icon.ico">
  <title>COUNTDOWN</title>
<style>
:root{
--green:#00ff9f;
--red:#ff0033;
--orange:#ffaa00;
}

*{box-sizing:border-box}

	 /* Digital Font laden */
		@font-face {
		  font-family: 'Digital';
		  src: url('assets/digital.ttf') format('truetype');
		  font-weight: normal;
		  font-style: normal;
		  font-display: swap;
		}
		
body{
margin:0;
height:100vh;
background:#000;
color:var(--green);
font-family: 'Digital', 'Courier New', monospace;
overflow:hidden;
}

/* HUD Layout */

.hud{
height:100%;
display:flex;
flex-direction:column;
padding:clamp(.8rem,2vw,2rem);
background:
radial-gradient(circle at center,#0a1a0f 0%,#000 75%);
position:relative;
}

/* Scanlines */

.hud::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
transparent 48%,
rgba(0,255,159,.04) 50%,
transparent 52%);
background-size:100% 4px;
pointer-events:none;
animation:scan 6s linear infinite;
}

@keyframes scan{
0%{transform:translateY(-100%)}
100%{transform:translateY(100%)}
}

/* Header */

header{
display:flex;
justify-content:space-between;
align-items:center;
}

h1{
margin:3.5rem;
font-size:clamp(1.1rem,4.3vw,3.0rem);
letter-spacing:.22em;
text-shadow:0 0 18px var(--green);
}

.sub{
margin:0;
opacity:.7;
letter-spacing:.18em;
}

.status{
border:2px solid var(--green);
padding:.3rem 1rem;
border-radius:6px;
background:#000a;
}

/* Timer */

.timer{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:1rem;
}

.time{
font-size:clamp(4rem,15vw,11rem);
font-weight:bold;
letter-spacing:.12em;
text-shadow:
0 0 25px currentColor,
0 0 60px currentColor;
}

/* Progressbar */

.bar-wrap{
width:min(92vw,1100px);
height:30px;
border:2px solid var(--green);
border-radius:999px;
overflow:hidden;
background:#111;
box-shadow:0 0 15px rgba(0,255,159,.3);
}

.bar{
height:100%;
transform-origin:left;
transform:scaleX(0);
background:var(--green);
transition:transform .25s linear;
}

/* Controls */

.controls{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:.8rem;
max-width:640px;
width:100%;
margin:auto;
}

.group{
display:flex;
flex-direction:column;
gap:.3rem;
}

label{
font-size:.9rem;
opacity:.8;
letter-spacing:.14em;
}

input{
background:#0a0a0a;
border:2px solid var(--green);
color:var(--green);
text-align:center;
font-size:1.7rem;
border-radius:8px;
padding:.3rem;
}

button{
border:3px solid;
border-radius:10px;
background:none;
font-size:1.3rem;
padding:.4rem;
cursor:pointer;
transition:.15s;
}

button:hover{
transform:scale(1.05);
filter:brightness(1.2);
}

.start{border-color:var(--green);color:var(--green);grid-column:span 2}
.pause{border-color:var(--orange);color:var(--orange);display:none}
.reset{border-color:var(--red);color:var(--red)}

/* Warning states */

.warn .bar{
background:var(--orange);
box-shadow:0 0 25px var(--orange);
}

.urgent .bar{
background:var(--red);
box-shadow:0 0 40px var(--red);
animation:pulse .7s infinite alternate;
}

.urgent .time{
color:var(--red);
}

@keyframes pulse{
to{opacity:.7}
}

/* ===== Handy Querformat Fix ===== */

@media (orientation: landscape) and (max-height: 600px){

.hud{
padding:.4rem 1rem;
}

header{
margin-bottom:.2rem;
}

h1{
font-size:clamp(1.2rem,4vw,2rem);
}

.sub{
font-size:.7rem;
}

.timer{
gap:.3rem;
justify-content:flex-start;
}

.time{
font-size:clamp(2.6rem,8vw,5rem);
margin-top:.2rem;
}

.bar-wrap{
height:16px;
width:88vw;
}

.controls{
grid-template-columns:repeat(6,1fr);
gap:.4rem;
width:95%;
}

.group{
grid-column:span 2;
}

.start{
grid-column:span 2;
}

.pause{
grid-column:span 1;
display:block !important;
}

.reset{
grid-column:span 1;
}

input{
font-size:1.2rem;
padding:.2rem;
}

button{
font-size:.9rem;
padding:.25rem;
}

label{
font-size:.65rem;
}

}
</style>
</head>

<body>

<div class="hud">

<header>
<div>
<h1>COUNTDOWN PRO</h1>

</div>

<div id="status" class="status">BEREIT</div>
</header>

<div id="timer" class="timer">

<div id="time" class="time">00:00:00</div>
<div class="sub">◎ HUPSCLICK manfred häcker</div>
<div class="bar-wrap">
<div id="bar" class="bar"></div>
</div>

</div>

<div class="controls">

<div class="group">
<label>STUNDEN</label>
<input id="h" type="number" min="0" max="99" value="0">
</div>

<div class="group">
<label>MINUTEN</label>
<input id="m" type="number" min="0" max="59" value="0">
</div>

<div class="group">
<label>SEKUNDEN</label>
<input id="s" type="number" min="0" max="59" value="0">
</div>

<button id="start" class="start">START</button>
<button id="pause" class="pause">PAUSE</button>
<button id="reset" class="reset">RESET</button>

</div>

</div>

<audio id="warnSound" src="assets/Coundown Weiblich2.mp3"></audio>

<script>

/* DOM shortcut */

const $=id=>document.getElementById(id)

/* Timer state */

let running=false
let endTime=0
let total=0
let warned=false
let lastSecond=-1

/* Format */

const pad=n=>String(n).padStart(2,"0")

function format(t){
let h=Math.floor(t/3600)
let m=Math.floor((t%3600)/60)
let s=Math.floor(t%60)
return `${pad(h)}:${pad(m)}:${pad(s)}`
}

/* Main loop */

function loop(){

if(!running)return

let now=Date.now()
let left=Math.max(0,(endTime-now)/1000)

let sec=Math.floor(left)

if(sec!==lastSecond){

$("time").textContent=format(sec)

$("bar").style.transform=
`scaleX(${sec/total})`

let t=$("timer")
t.classList.remove("warn","urgent")

if(sec<=60 && sec>10) t.classList.add("warn")
if(sec<=10 && sec>0) t.classList.add("urgent")

if(sec<=10 && !warned){
$("warnSound").play().catch(()=>{})
warned=true
}

lastSecond=sec
}

if(left<=0){
running=false
$("status").textContent="ABGELAUFEN"
$("start").style.display="block"
$("pause").style.display="none"
return
}

requestAnimationFrame(loop)

}

/* Start */

function start(){

if(running)return

let seconds=
($("h").value|0)*3600+
($("m").value|0)*60+
($("s").value|0)

if(seconds<=0)return

total=seconds
warned=false
lastSecond=-1

endTime=Date.now()+seconds*1000

running=true

$("status").textContent="LÄUFT"
$("start").style.display="none"
$("pause").style.display="block"

loop()

}

/* Pause */

function pause(){

running=!running

if(running){
$("status").textContent="LÄUFT"
loop()
$("pause").textContent="PAUSE"
}else{
$("status").textContent="PAUSE"
$("pause").textContent="FORTSETZEN"
endTime=Date.now()+lastSecond*1000
}

}

/* Reset */

function reset(){

running=false

$("time").textContent="00:00:00"
$("bar").style.transform="scaleX(0)"
$("status").textContent="BEREIT"

$("start").style.display="block"
$("pause").style.display="none"

}

/* Buttons */

$("start").onclick=start
$("pause").onclick=pause
$("reset").onclick=reset

/* Hotkeys */

window.addEventListener("keydown",e=>{

if(e.code==="Space"){
e.preventDefault()
running?pause():start()
}

if(e.code==="KeyR")reset()

})

</script>

</body>
</html>
